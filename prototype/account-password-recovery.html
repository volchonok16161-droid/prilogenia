<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Восстановление пароля</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:460px;margin:8vh auto}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:24px;box-shadow:0 8px 28px #1a27440c}h1{font-size:22px;margin:0 0 8px}p{color:#64748b;line-height:1.5;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #d8dfeb;border-radius:10px;font:inherit}button{margin-top:18px;border:0;border-radius:10px;padding:12px 16px;background:#315efb;color:white;font:inherit;font-weight:650;cursor:pointer;width:100%}button:disabled{opacity:.55}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#edf2ff;color:#244bd4;font-size:14px;white-space:pre-wrap}.err{background:#fff0ee;color:#a33b30}.hidden{display:none}
</style></head>
<body><main class="wrap"><section class="card">
<h1 id="title">Восстановление пароля</h1>
<p id="intro">Укажите email аккаунта. Мы отправим ссылку для создания нового пароля.</p>
<form id="requestForm">
<label for="email">Email аккаунта</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
<button id="requestBtn" type="submit">Отправить ссылку</button>
</form>
<form id="passwordForm" class="hidden">
<label for="password">Новый пароль (от 8 символов)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Повторите пароль</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="saveBtn" type="submit">Сохранить пароль</button>
</form>
<div id="msg" class="msg">Если письмо не приходит, проверьте папку «Спам».</div>
</section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://fecigiwjtbtabnsfsdym.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_j-bQu5o4dgj13X-8_7maOA_7KvkLuqH";
const REDIRECT_URL="https://prilogenia-password-recovery.onrender.com/";
const $=id=>document.getElementById(id);
const show=(s,err=false)=>{$("msg").textContent=s;$("msg").classList.toggle("err",err)};
const client=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit"}});
let recovery=false;
function setRecovery(){recovery=true;$("requestForm").classList.add("hidden");$("passwordForm").classList.remove("hidden");$("title").textContent="Создание нового пароля";$("intro").textContent="Ссылка подтверждена. Придумайте новый пароль.";show("Введите и подтвердите новый пароль.");}
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)setRecovery();});
const hash=new URLSearchParams(location.hash.slice(1));
if(hash.has("access_token")||new URLSearchParams(location.search).has("code")){
  setTimeout(async()=>{const {data:{session}}=await client.auth.getSession();if(session)setRecovery();else show("Ссылка недействительна или уже истекла. Запросите новое письмо.",true)},400);
}
$("requestForm").addEventListener("submit",async e=>{
 e.preventDefault();$("requestBtn").disabled=true;
 const {error}=await client.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo:REDIRECT_URL});
 $("requestBtn").disabled=false;
 if(error)show("Не удалось отправить письмо: "+error.message,true);
 else show("Если аккаунт с таким email существует, письмо отправлено. Проверьте входящие и «Спам».");
});
$("passwordForm").addEventListener("submit",async e=>{
 e.preventDefault();const p=$("password").value,c=$("confirm").value;
 if(p.length<8){show("Пароль должен содержать минимум 8 символов.",true);return}
 if(p!==c){show("Пароли не совпадают.",true);return}
 $("saveBtn").disabled=true;const {error}=await client.auth.updateUser({password:p});$("saveBtn").disabled=false;
 if(error)show("Не удалось сохранить пароль: "+error.message,true);
 else{show("Пароль успешно изменён. Теперь можно войти в приложение.");await client.auth.signOut();$("passwordForm").classList.add("hidden");$("title").textContent="Пароль изменён";$("intro").textContent="Восстановление завершено."}
});
</script></body></html>
