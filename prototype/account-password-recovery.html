<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Смена пароля</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:460px;margin:8vh auto}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:24px;box-shadow:0 8px 28px #1a27440c}h1{font-size:22px;margin:0 0 8px}p{color:#64748b;line-height:1.5;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #d8dfeb;border-radius:10px;font:inherit}button{margin-top:18px;border:0;border-radius:10px;padding:12px 16px;background:#315efb;color:white;font:inherit;font-weight:650;cursor:pointer;width:100%}button:disabled{opacity:.55}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#edf2ff;color:#244bd4;font-size:14px;white-space:pre-wrap}.err{background:#fff0ee;color:#a33b30}.hidden{display:none}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>Создание нового пароля</h1>
<p>Откройте эту страницу по ссылке из письма Supabase. После проверки ссылки задайте новый пароль.</p>
<form id="form" class="hidden">
<label for="password">Новый пароль</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="Не менее 8 символов">
<label for="confirm">Повторите пароль</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Повторите новый пароль">
<button id="submit" type="submit">Сохранить пароль</button>
</form>
<div id="msg" class="msg">Проверяем ссылку восстановления…</div>
</section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL = "https://fecigiwjtbtabnsfsdym.supabase.co";
const SUPABASE_ANON_KEY = ""; // Вставьте публичный anon/publishable key проекта перед использованием.
const msg = document.getElementById("msg");
const form = document.getElementById("form");
const show = (text,error=false)=>{msg.textContent=text;msg.classList.toggle("err",error);msg.classList.remove("hidden")};
if(!SUPABASE_ANON_KEY){
 show("Страница подготовлена, но для запуска нужен публичный anon/publishable key проекта. Секретный service_role key сюда вставлять нельзя.",true);
} else {
 const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data:{subscription}}=supabase.auth.onAuthStateChange((event,session)=>{
   if(event==="PASSWORD_RECOVERY" && session){form.classList.remove("hidden");show("Ссылка подтверждена. Теперь задайте новый пароль.");}
 });
 const {data:{session},error}=await supabase.auth.getSession();
 if(error) show("Не удалось проверить ссылку: "+error.message,true);
 else if(session){form.classList.remove("hidden");show("Ссылка подтверждена. Теперь задайте новый пароль.");}
 else show("Ссылка недействительна или истекла. Запросите новое письмо восстановления.",true);
 form.addEventListener("submit",async e=>{
   e.preventDefault();
   const password=document.getElementById("password").value;
   const confirm=document.getElementById("confirm").value;
   if(password.length<8){show("Пароль должен содержать не менее 8 символов.",true);return;}
   if(password!==confirm){show("Пароли не совпадают.",true);return;}
   const button=document.getElementById("submit");button.disabled=true;
   const {error}=await supabase.auth.updateUser({password});
   button.disabled=false;
   if(error) show("Не удалось сохранить пароль: "+error.message,true);
   else {form.classList.add("hidden");show("Пароль успешно изменён. Теперь можно войти в тестовую панель.");await supabase.auth.signOut();}
 });
 window.addEventListener("pagehide",()=>subscription.unsubscribe());
}
</script></body></html>
