name: Constructor preview parity

on:
  push:
    branches:
      - fix/constructor-preview-parity
  pull_request:
    branches:
      - fix/constructor-preview-parity

jobs:
  preview-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/constructor-preview-parity.test.mjs
