<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Прототип офлайн-хранилища — тестовый стенд</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f6fa}body{max-width:820px;margin:0 auto;padding:20px}
main{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:20px}label{display:block;margin:12px 0 5px;font-weight:600}
input,textarea,button{font:inherit;padding:10px;border:1px solid #b9c5d5;border-radius:8px;box-sizing:border-box;width:100%}
textarea{min-height:90px}button{cursor:pointer;background:#174ea6;color:#fff;border:0;margin-top:10px}button.secondary{background:#e8eef7;color:#172033}
.warning{background:#fff3cd;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fa;padding:12px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Тестовый стенд: офлайн-хранилище</h1>
<p class="warning"><strong>Это отдельный прототип.</strong> Он не подключён к рабочим чек-листам, GitHub или облаку и не читает старые ключи. Не вводите реальные персональные данные.</p>
<label for="owner">Тестовый ID сотрудника</label><input id="owner" value="demo-worker-1" autocomplete="off">
<label for="record">ID тестовой записи</label><input id="record" value="demo-check-1">
<label for="payload">Тестовое содержимое (JSON)</label><textarea id="payload">{"equipment":"ТЕСТОВЫЙ локомотив","status":"черновик"}</textarea>
<button id="save">Сохранить локально и добавить в очередь</button>
<button id="refresh" class="secondary">Обновить список и очередь</button>
<button id="mockSync" class="secondary">Проверить очередь на имитационном сервере</button>
<button id="clear" class="secondary">Очистить только данные прототипа</button>
<h2>Результат</h2><pre id="output" role="status">Готово к тестированию. Для офлайн-проверки сначала откройте страницу при наличии сети.</pre>
</main>
<script src="./sync-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const out = $('output');
function show(value){out.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);}
$('save').addEventListener('click',async()=>{
 try{
  const data=JSON.parse($('payload').value);
  const saved=await ChecklistSyncPrototype.saveRecord($('owner').value,{id:$('record').value.trim(),data});
  show({message:'Сохранено только в IndexedDB прототипа',record:saved});
 }catch(e){show('Ошибка: '+e.message);}
});
$('refresh').addEventListener('click',async()=>{
 try{
  show({database:ChecklistSyncPrototype.dbName,records:await ChecklistSyncPrototype.listRecords($('owner').value),pending:await ChecklistSyncPrototype.listPending($('owner').value)});
 }catch(e){show('Ошибка: '+e.message);}
});
$('mockSync').addEventListener('click',async()=>{
 try{
  const result=await ChecklistSyncPrototype.syncOwner($('owner').value,{push:async op=>({status:'ok'})});
  show({message:'Использован только имитационный транспорт; данные никуда не отправлялись.',result,pending:await ChecklistSyncPrototype.listPending($('owner').value)});
 }catch(e){show('Ожидаемо: '+e.message);}
});
$('clear').addEventListener('click',async()=>{
 if(!confirm('Удалить все данные только из базы checklist_sync_prototype_v1?')) return;
 try{await ChecklistSyncPrototype.clearPrototypeData();show('Данные отдельного прототипа очищены. Старые чек-листы не затронуты.');}
 catch(e){show('Ошибка: '+e.message);}
});
</script>
</body>
</html>
